version: 2
models:
  - name: fct_treasury_yields
    description: "Fact table: daily Treasury yields by maturity."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [yield_date, maturity_label]
    columns:
      - name: yield_pct
        description: "Yield percent."
        tests: [not_null]
        