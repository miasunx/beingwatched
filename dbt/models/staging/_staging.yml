version: 2
models:
  - name: stg_fred__yields
    description: "Cleaned FRED Treasury yields; one row per maturity per date, with the observation's realtime (vintage) validity window preserved."
    columns:
      - name: yield_date
        description: "Observation date."
        tests: [not_null]
      - name: maturity_label
        description: "Maturity bucket."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["10Y", "2Y"]
      - name: yield_pct
        description: "Yield as a percent (e.g. 4.35)."
        tests: [not_null]
      - name: yield_realtime_start
        description: "Start of the vintage window during which this value was the officially published observation."
        tests: [not_null]
      - name: yield_realtime_end
        description: "End of the vintage window during which this value was the officially published observation."
        tests: [not_null]

  - name: stg_fred__series_meta
    description: "Series-level metadata (units, frequency, seasonal adjustment) for onboarding validation before promoting a new FRED series. Unions the series-meta raw table from every FRED domain (yields, CPI, PCE, NFP)."
    columns:
      - name: series_id
        description: "FRED series identifier."
        tests: [not_null, unique]
      - name: units
        description: "Unit of the series values as published by FRED (e.g. 'Percent')."
        tests: [not_null]
      - name: seasonal_adjustment
        description: "Seasonal adjustment basis (e.g. 'Not Seasonally Adjusted')."
        tests: [not_null]

  - name: stg_fred__cpi
    description: "Cleaned FRED CPI index levels; one row per measure (headline/core) per date."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [cpi_date, measure_label]
    columns:
      - name: cpi_date
        description: "Observation date (first of the release month)."
        tests: [not_null]
      - name: measure_label
        description: "CPI measure."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["headline", "core"]
      - name: index_level
        description: "CPI index level (not seasonally adjusted units as published)."
        tests: [not_null]

  - name: stg_fred__pce
    description: "Cleaned FRED PCE price index levels; one row per measure (headline/core) per date."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [pce_date, measure_label]
    columns:
      - name: pce_date
        description: "Observation date (first of the release month)."
        tests: [not_null]
      - name: measure_label
        description: "PCE measure."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["headline", "core"]
      - name: index_level
        description: "PCE price index level as published."
        tests: [not_null]

  - name: stg_fred__nfp
    description: "Cleaned FRED nonfarm payrolls level (PAYEMS); one row per date."
    columns:
      - name: nfp_date
        description: "Observation date (first of the release month)."
        tests: [not_null, unique]
      - name: payrolls_level
        description: "Total nonfarm payroll employment level, in thousands."
        tests: [not_null]
